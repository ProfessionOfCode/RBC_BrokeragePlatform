name: Build and Test Pull Requests
run-name: PR #${{ github.event.pull_request.number || 'manual' }} - build and test

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build solution and run all tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore src/RBC.BrokeragePlatform/RBC.BrokeragePlatform.slnx

      - name: Build solution
        run: dotnet build src/RBC.BrokeragePlatform/RBC.BrokeragePlatform.slnx --configuration Release --no-restore --verbosity minimal

      - name: Test Application
        run: >
          dotnet test
          src/RBC.BrokeragePlatform/RBC.BrokeragePlatform.Application.Tests/RBC.BrokeragePlatform.Application.Tests.csproj
          --configuration Release --no-restore --verbosity minimal
          --logger "trx;LogFileName=application.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Application

      - name: Test Web API
        run: >
          dotnet test
          src/RBC.BrokeragePlatform/RBC.BrokeragePlatform.WebAPI.Tests/RBC.BrokeragePlatform.WebAPI.Tests.csproj
          --configuration Release --no-restore --verbosity minimal
          --logger "trx;LogFileName=webapi.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/WebAPI

      - name: Test Presentation
        run: >
          dotnet test
          src/RBC.BrokeragePlatform/RBC.BrokeragePlatform.Presentation.Tests/RBC.BrokeragePlatform.Presentation.Tests.csproj
          --configuration Release --no-restore --verbosity minimal
          --logger "trx;LogFileName=presentation.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/Presentation

      - name: Create combined coverage report
        if: success()
        shell: pwsh
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool `
            --tool-path ./.tools --version 5.4.4
          ./.tools/reportgenerator.exe `
            "-reports:TestResults/**/coverage.cobertura.xml" `
            "-targetdir:coverage" `
            "-reporttypes:Cobertura;Html;MarkdownSummaryGithub"
          Get-Content coverage/SummaryGithub.md |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            TestResults/**
            coverage/**
          if-no-files-found: ignore
          retention-days: 14